kind = "mobile"
previewPath = "/"
title = "Bolo Urdu"
version = "1.0.0"
id = "artifacts/bolo-urdu"
router = "expo-domain"

[[integratedSkills]]
name = "expo"
version = "1.0.0"

[[services]]
ensurePreviewReachable = "/status"
name = "expo"
paths = [ "/" ]
localPort = 23100

[services.development]
run = "pnpm --filter @workspace/bolo-urdu run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/bolo-urdu", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/bolo-urdu", "run", "serve" ]

[services.env]
PORT = "23100"
BASE_PATH = "/"
